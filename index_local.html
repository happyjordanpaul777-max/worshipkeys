<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101a2c"><title>WorshipKeys</title>
<style>
:root{--bg:#f4f6fa;--ink:#172238;--muted:#6e7890;--line:#e4e8f0;--gold:#d7a94d;--navy:#101a2c}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,"Noto Sans Tamil",sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0}.top{background:linear-gradient(120deg,#101a2c,#1c3150);color:white;padding:17px max(18px,calc((100% - 1080px)/2));display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{display:flex;gap:11px;align-items:center}.logo{width:43px;height:43px;border-radius:13px;background:linear-gradient(145deg,#f2d28b,#b9812e);display:grid;place-items:center;color:#172238;font-size:23px;font-weight:900}.brand h1{margin:0;font-size:21px}.brand p{margin:0;color:#c1cde0;font-size:12px}.primary{background:var(--gold);color:#1a2434;padding:10px 15px;border-radius:10px;font-weight:800}.secondary{background:#edf1f7;color:#24334c;padding:9px 12px;border-radius:10px;font-weight:700}.danger{background:#fff0ef;color:#a83a34;padding:9px 12px;border-radius:10px;font-weight:700}.wrap{max-width:1080px;margin:24px auto;padding:0 18px}.row{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.between{justify-content:space-between}.search{flex:1;min-width:200px}.search input,.field input,.field select,.field textarea{width:100%;padding:11px;border:1px solid #dce2ec;border-radius:10px;background:white;color:#1b2940}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:13px}.card,.panel{background:white;border:1px solid var(--line);border-radius:16px;padding:17px;box-shadow:0 10px 28px #1722380d}.song{cursor:pointer}.song:hover{border-color:#b7c8df}.song h3{margin:0 0 5px}.sub,.hint{color:var(--muted);font-size:12px}.meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}.tag{background:#f0f3f8;color:#46536b;padding:4px 8px;border-radius:8px;font-size:12px}.hidden{display:none!important}.empty{text-align:center;padding:36px;background:white;border:1px dashed #ccd4e1;border-radius:15px;color:var(--muted)}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:16px 0}.stat{background:#f5f7fb;border-radius:10px;padding:10px}.stat small{display:block;color:var(--muted);font-size:10px;text-transform:uppercase}.stat strong{font-size:18px}.lyrics{background:#111e33;color:#f8f4e9;border-radius:14px;padding:20px;overflow:auto}.lyrics h4{margin:0 0 12px;color:#e7c77e}.lyrictext{white-space:pre-wrap;line-height:1.9;font-size:clamp(18px,2vw,23px);font-family:"Noto Sans Tamil","Nirmala UI",system-ui,sans-serif}.field{display:flex;flex-direction:column;gap:5px;margin-bottom:10px}.field label{font-size:11px;color:#647089;font-weight:800}.field textarea{min-height:180px;resize:vertical;font-family:inherit}.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.full{grid-column:1/-1}.modalbg{position:fixed;inset:0;background:#101a2ccc;display:grid;place-items:center;padding:14px;z-index:5}.modal{width:min(720px,100%);max-height:93vh;overflow:auto;background:white;border-radius:17px;padding:20px}.modal h2{margin:0 0 14px}.modalfoot{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-top:14px}.toast{position:fixed;bottom:17px;left:50%;transform:translateX(-50%);background:#17263d;color:white;padding:10px 15px;border-radius:30px;z-index:10}.importlabel{display:inline-flex;align-items:center;gap:7px}.sync{font-size:12px;color:#dbe5f3}@media(max-width:620px){.top{padding:14px}.wrap{margin:16px auto}.stats{grid-template-columns:repeat(2,1fr)}.formgrid{grid-template-columns:1fr}.full{grid-column:auto}.brand h1{font-size:19px}}
</style></head><body>
<header class="top"><div class="brand"><div class="logo">♫</div><div><h1>WorshipKeys</h1><p>Your personal church keyboard songbook</p></div></div><div class="sync">● Local songbook · Offline ready</div></header>
<main class="wrap"><section id="home"><div class="row between" style="margin-bottom:15px"><div><h2 style="margin:0">My Songbook</h2><div class="sub">Songs you save here are shared with your other laptop.</div></div><div class="row"><button class="secondary" id="exportBook">↓ Export songbook</button><label class="secondary importlabel">↑ Import backup<input id="backupImport" type="file" accept=".worshipkeys,.json,application/json" hidden></label><label class="secondary importlabel">＋ Import .txt<input id="fileImport" type="file" accept=".txt,text/plain" multiple hidden></label><button class="primary" id="addSong">＋ Add song</button></div></div><div class="row" style="margin-bottom:15px"><div class="search"><input id="search" placeholder="Search songs..."></div><button class="secondary" id="refresh">↻ Refresh</button></div><div id="songGrid" class="grid"></div></section>
<section id="detail" class="hidden"><button class="secondary" id="back">← Back to songs</button><div class="panel" style="margin-top:12px"><div class="row between"><div><h2 id="dTitle" style="margin:0"></h2><div class="sub" id="dSub"></div></div><div class="row"><button class="secondary" id="editSong">Edit</button><button class="danger" id="deleteSong">Delete</button></div></div><div id="dStats" class="stats"></div><div class="lyrics"><h4>LYRICS & ACCOMPANIMENT CUES</h4><div id="dLyrics" class="lyrictext"></div></div></div></section></main>
<div id="songModal" class="modalbg hidden"><div class="modal"><h2 id="modalTitle">Add song</h2><form id="songForm"><input type="hidden" id="songId"><div class="formgrid">
<div class="field full"><label>SONG TITLE *</label><input id="title" required maxlength="200"></div>
<div class="field"><label>ORIGINAL KEY</label><input id="songKey" placeholder="C, F, G..."></div><div class="field"><label>TRANSPOSE</label><select id="transpose"><option value="0">0</option><option>-6</option><option>-5</option><option>-4</option><option>-3</option><option>-2</option><option>-1</option><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option><option>6</option></select></div>
<div class="field"><label>TEMPO FEEL</label><select id="tempoFeel"><option>Low / Slow</option><option selected>Medium</option><option>High / Fast</option><option>Custom</option></select></div><div class="field"><label>BPM (optional)</label><input id="bpm" type="number" min="30" max="300"></div>
<div class="field"><label>BEAT</label><select id="beat"><option value="">Not set</option><option>2/4</option><option>3/4</option><option>4/4</option><option>6/8</option><option>9/8</option><option>12/8</option></select></div><div class="field"><label>ACCOMPANIMENT STYLE</label><input id="style" placeholder="8 Beat, Waltz, Ballad..."></div>
<div class="field"><label>CATEGORY</label><input id="category"></div><div class="field full"><label>LYRICS WITH CHORDS *</label><textarea id="lyrics" required placeholder="C                         F&#10;Your lyric line goes here&#10;G                         C&#10;Next lyric line goes here"></textarea><span class="hint">Put chord names on a separate line above each lyric line.</span></div>
<div class="field full"><label>ARRANGEMENT NOTES</label><input id="notes" placeholder="Intro · Verse · Chorus · Ending"></div></div><div class="modalfoot"><button type="button" class="danger" id="deleteInForm">Delete</button><div class="row"><button type="button" class="secondary" id="cancelSong">Cancel</button><button class="primary">Save song</button></div></div></form></div></div><div id="toast" class="toast hidden"></div>
<script>
const $=id=>document.getElementById(id);let songs=[],activeSong=null;
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function toast(t){$("toast").textContent=t;$("toast").classList.remove("hidden");setTimeout(()=>$("toast").classList.add("hidden"),2600)}
async function api(url,options={}){const res=await fetch(url,{headers:{"Content-Type":"application/json",...(options.headers||{})},...options});let data={};try{data=await res.json()}catch{}if(!res.ok)throw new Error(data.detail||"Request failed");return data}
async function loadSongs(){try{songs=await api("/api/local/songs");renderSongs()}catch(e){toast("Could not load songs: "+e.message)}}
function renderSongs(){const q=$("search").value.toLowerCase();const rows=songs.filter(s=>(s.title+" "+s.category+" "+s.song_key).toLowerCase().includes(q));$("songGrid").innerHTML=rows.length?rows.map(s=>'<article class="card song" data-id="'+s.id+'"><h3>'+esc(s.title)+'</h3><div class="sub">'+esc(s.category||"Song")+'</div><div class="meta"><span class="tag">'+esc(s.song_key||"Key not set")+'</span><span class="tag">'+esc(s.tempo_feel)+'</span>'+(s.bpm?'<span class="tag">'+s.bpm+' BPM</span>':"")+'</div></article>').join(""):'<div class="empty">Your songbook is empty. Click “Add song” or import .txt files to begin.</div>';document.querySelectorAll(".song").forEach(el=>el.onclick=()=>openDetail(Number(el.dataset.id)))}
function openDetail(id){activeSong=songs.find(s=>s.id===id);if(!activeSong)return;$("home").classList.add("hidden");$("detail").classList.remove("hidden");$("dTitle").textContent=activeSong.title;$("dSub").textContent=activeSong.category||"Worship song";$("dStats").innerHTML=[["KEY",activeSong.song_key||"—"],["TEMPO",activeSong.tempo_feel],["BPM",activeSong.bpm||"—"],["BEAT",activeSong.beat||"—"],["TRANSPOSE",activeSong.transpose>0?"+"+activeSong.transpose:activeSong.transpose],["STYLE",activeSong.accompaniment_style||"—"],["NOTES",activeSong.notes||"—"]].map(x=>'<div class="stat"><small>'+esc(x[0])+'</small><strong>'+esc(x[1])+'</strong></div>').join("");$("dLyrics").textContent=activeSong.lyrics}
function closeDetail(){$("detail").classList.add("hidden");$("home").classList.remove("hidden");activeSong=null}
$("back").onclick=closeDetail;$("search").oninput=renderSongs;$("refresh").onclick=loadSongs;
function openSong(s=null){$("songModal").classList.remove("hidden");$("modalTitle").textContent=s?"Edit song":"Add song";$("songId").value=s?.id||"";$("title").value=s?.title||"";$("songKey").value=s?.song_key||"";$("transpose").value=s?.transpose??0;$("tempoFeel").value=s?.tempo_feel||"Medium";$("bpm").value=s?.bpm||"";$("beat").value=s?.beat||"";$("style").value=s?.accompaniment_style||"";$("category").value=s?.category||"";$("lyrics").value=s?.lyrics||"";$("notes").value=s?.notes||"";$("deleteInForm").classList.toggle("hidden",!s)}
$("addSong").onclick=()=>openSong();$("editSong").onclick=()=>openSong(activeSong);$("cancelSong").onclick=()=>$("songModal").classList.add("hidden");
async function deleteCurrent(){const id=$("songId").value||activeSong?.id;if(!id||!confirm("Delete this song permanently from the shared songbook?"))return;try{await api("/api/local/songs/"+id,{method:"DELETE"});$("songModal").classList.add("hidden");closeDetail();await loadSongs();toast("Song deleted from shared songbook")}catch(e){toast(e.message)}}
$("deleteSong").onclick=()=>deleteCurrent();$("deleteInForm").onclick=()=>deleteCurrent();
$("songForm").onsubmit=async e=>{e.preventDefault();const id=$("songId").value;const data={title:$("title").value.trim(),song_key:$("songKey").value.trim(),transpose:Number($("transpose").value),tempo_feel:$("tempoFeel").value,bpm:$("bpm").value?Number($("bpm").value):null,beat:$("beat").value,accompaniment_style:$("style").value.trim(),category:$("category").value.trim(),lyrics:$("lyrics").value,notes:$("notes").value.trim()};try{const saved=await api(id?"/api/local/songs/"+id:"/api/local/songs",{method:id?"PUT":"POST",body:JSON.stringify(data)});$("songModal").classList.add("hidden");await loadSongs();openDetail(saved.id);toast("Saved to shared cloud songbook")}catch(err){toast(err.message)}};
$("fileImport").onchange=async e=>{const files=[...e.target.files];for(const file of files){try{const lyrics=await file.text();const title=file.name.replace(/\.txt$/i,"").replace(/[_-]+/g," ").trim();await api("/api/local/songs",{method:"POST",body:JSON.stringify({title,song_key:"",transpose:0,tempo_feel:"Medium",bpm:null,beat:"",accompaniment_style:"",category:"Imported",lyrics,notes:""})})}catch(err){toast("Could not import "+file.name+": "+err.message);e.target.value="";return}}e.target.value="";await loadSongs();toast(files.length+" song file(s) imported and saved")};
$("exportBook").onclick=async()=>{try{const book=await api("/api/local/songbook/export");const blob=new Blob([JSON.stringify(book,null,2)],{type:"application/json"});const url=URL.createObjectURL(blob);const a=document.createElement("a");a.href=url;a.download="WorshipKeys-Backup-"+new Date().toISOString().slice(0,10)+".worshipkeys";a.click();URL.revokeObjectURL(url);toast("Songbook backup exported")}catch(e){toast("Export failed: "+e.message)}};
$("backupImport").onchange=async e=>{const file=e.target.files[0];if(!file)return;try{const book=JSON.parse(await file.text());if(book.format!=="WorshipKeys"||book.version!==1||!Array.isArray(book.songs))throw new Error("This is not a valid WorshipKeys backup");if(!confirm("Import "+book.songs.length+" songs? This replaces every song currently on this laptop."))return;const result=await api("/api/local/songbook/import",{method:"POST",body:JSON.stringify(book)});await loadSongs();closeDetail();toast(result.imported+" songs imported")}catch(err){toast("Import failed: "+err.message)}finally{e.target.value=""}};
loadSongs();
</script></body></html>
